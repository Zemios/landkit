<section class="hero-section relative flex h-screen items-center justify-center overflow-hidden">
  <!-- Background Orbs -->
  <div class="pointer-events-none absolute inset-0 overflow-hidden">
    <div class="neon-orb orb-purple animate-float-slow top-[-100px] left-[-100px] h-[500px] w-[500px] opacity-50"></div>
    <div
      class="neon-orb orb-cyan animate-float-slower right-[-50px] bottom-[-50px] h-[400px] w-[400px] opacity-40"
    ></div>
    <div class="neon-orb orb-magenta animate-float-slow top-[40%] left-[60%] h-[300px] w-[300px] opacity-35"></div>
    <div class="warm-orb orb-orange animate-float-slower top-[10%] right-[10%] h-[450px] w-[450px] opacity-45"></div>
    <div class="warm-orb orb-red animate-float-slow bottom-[20%] left-[5%] h-[350px] w-[350px] opacity-40"></div>
    <div class="warm-orb orb-yellow animate-float-slower top-[60%] right-[30%] h-[300px] w-[300px] opacity-35"></div>
  </div>

  <!-- Main Content -->
  <div class="relative z-10 px-6 text-center" data-aos="fade-in" data-aos-duration="1500">
    <!-- Badge -->
    <span
      class="mb-8 inline-block rounded-full border border-slate-700/50 bg-slate-900/60 px-4 py-1.5 text-[11px] font-medium tracking-[0.3em] text-slate-400 uppercase backdrop-blur-sm"
      data-aos="fade-down"
      data-aos-delay="200"
      >Digital Future</span
    >

    <!-- Brand SVG -->
    <img
      src="images/zemios_title_simple.svg"
      alt="ZEMIOS"
      class="hero-logo mx-auto mb-10 h-auto w-[50vw] max-w-[500px] md:w-[35vw] lg:w-[25vw]"
    />

    <!-- Headline -->
    <h1
      class="mx-auto mb-6 max-w-3xl text-4xl leading-tight font-semibold tracking-tight text-white md:text-5xl lg:text-6xl"
      style="font-family: &quot;Outfit&quot;, sans-serif"
      data-aos="fade-up"
      data-aos-delay="400"
    >
      {{ 'hero.headline' | translate }}
      <span
        style="
          background: linear-gradient(135deg, #60a5fa, #a78bfa);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        "
        >{{ 'hero.headlineAccent' | translate }}</span
      >
    </h1>

    <!-- Subtitle -->
    <p
      class="mx-auto max-w-xl text-lg leading-relaxed font-light text-slate-400"
      style="font-family: &quot;Outfit&quot;, sans-serif"
      data-aos="fade-up"
      data-aos-delay="600"
    >
      {{ 'hero.subtitle' | translate }}
    </p>
  </div>

  <!-- Scroll Indicator -->
  <div
    class="absolute bottom-12 flex cursor-pointer flex-col items-center gap-3 opacity-40 transition-opacity hover:opacity-80"
    data-aos="fade-up"
    data-aos-offset="-200"
    data-aos-delay="2500"
  >
    <span class="text-[9px] font-medium tracking-[0.3em] text-slate-500 uppercase">Scroll</span>
    <div class="flex h-8 w-5 items-start justify-center rounded-full border border-slate-600/50 p-1">
      <div class="h-2 w-1 animate-bounce rounded-full bg-slate-400"></div>
    </div>
  </div>
</section>
