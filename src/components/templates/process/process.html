<!-- METHODOLOGY - Process Timeline -->
<section class="z-process">
  <div class="z-process__inner">
    <div class="z-process__grid">
      <div data-aos="fade-right" class="z-process__intro">
        <span class="z-process__badge">{{ 'process.badge' | translate }}</span>
        <h2 class="z-process__title">
          {{ 'process.title' | translate }}
          <span class="z-text-brand-gradient">{{ 'process.titleAccent' | translate }}</span>
        </h2>
        <p class="z-process__subtitle">{{ 'process.subtitle' | translate }}</p>
      </div>

      <!-- Timeline -->
      <div class="z-process__timeline" data-aos="fade-left">
        @for (step of steps; track step.number; let last = $last) {
          <div class="z-process-step">
            <div class="z-process-step__rail">
              <div class="z-process-step__node">
                <span class="z-process-step__number">{{ step.number }}</span>
              </div>
              @if (!last) {
                <div class="z-process-step__connector"></div>
              }
            </div>
            <div class="z-process-step__body">
              <h4 class="z-process-step__title">{{ step.title }}</h4>
              <p class="z-process-step__description">{{ step.description }}</p>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</section>
