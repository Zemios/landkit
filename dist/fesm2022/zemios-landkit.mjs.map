<!-- OUR CORE - Open layout with Lottie placeholders -->
<section class="z-features-grid">
  <div class="z-features-grid__inner">
    <div class="z-features-grid__grid">
      @for (feature of features; track feature.title; let i = $index) {
        <div
          class="z-feature"
          data-aos="fade-up"
          [attr.data-aos-delay]="feature.delay"
        >
          <!-- Lottie animation -->
          <div
            class="z-feature__icon"
            [style.--feature-rgb]="feature.rgbColor"
          >
            <dotlottie-wc [attr.src]="feature.lottieFile" autoplay loop></dotlottie-wc>
          </div>

          <!-- Title -->
          <h3 class="z-feature__title">
            {{ feature.title | translate }}
          </h3>

          <!-- Description -->
          <p class="z-feature__description">
            {{ feature.description | translate }}
          </p>

          <!-- Subtle separator (not on last item) -->
          @if (!$last) {
            <div class="z-feature__separator"></div>
          }
        </div>
      }
    </div>
  </div>
</section>
