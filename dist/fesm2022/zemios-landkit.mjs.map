<section class="hero-section relative flex h-screen items-center justify-center overflow-hidden">
  <!-- Background Orbs -->
  <div class="pointer-events-none absolute inset-0 overflow-hidden">
    <div
      class="neon-orb orb-purple animate-float-slow"
      style="top: -100px; left: -100px; width: 500px; height: 500px; opacity: 0.5"
    ></div>
    <div
      class="neon-orb orb-cyan animate-float-slower"
      style="right: -50px; bottom: -50px; width: 400px; height: 400px; opacity: 0.4"
    ></div>
    <div
      class="neon-orb orb-magenta animate-float-slow"
      style="top: 40%; left: 60%; width: 300px; height: 300px; opacity: 0.35"
    ></div>
    <div
      class="warm-orb orb-orange animate-float-slower"
      style="top: 10%; right: 10%; width: 450px; height: 450px; opacity: 0.45"
    ></div>
    <div
      class="warm-orb orb-red animate-float-slow"
      style="bottom: 20%; left: 5%; width: 350px; height: 350px; opacity: 0.4"
    ></div>
    <div
      class="warm-orb orb-yellow animate-float-slower"
      style="top: 60%; right: 30%; width: 300px; height: 300px; opacity: 0.35"
    ></div>
  </div>

  <!-- Main Content -->
  <div class="relative z-10 px-6 text-center" data-aos="fade-in" data-aos-duration="1500">
    <!-- Badge -->
    <span class="hero-badge" data-aos="fade-down" data-aos-delay="200">Digital Future</span>

    <!-- Brand SVG -->
    <img
      src="images/zemios_title_simple.svg"
      alt="ZEMIOS"
      class="hero-logo mx-auto mb-10 h-auto"
      style="width: 50vw; max-width: 500px"
    />

    <!-- Headline -->
    <h1 class="hero-headline" data-aos="fade-up" data-aos-delay="400">
      {{ 'hero.headline' | translate }}
      <span class="z-text-brand-gradient">{{ 'hero.headlineAccent' | translate }}</span>
    </h1>

    <!-- Subtitle -->
    <p class="hero-subtitle" data-aos="fade-up" data-aos-delay="600">
      {{ 'hero.subtitle' | translate }}
    </p>
  </div>

  <!-- Scroll Indicator -->
  <div
    class="hero-scroll"
    data-aos="fade-up"
    data-aos-offset="-200"
    data-aos-delay="2500"
  >
    <span class="hero-scroll__label">Scroll</span>
    <div class="hero-scroll__indicator">
      <div class="hero-scroll__dot"></div>
    </div>
  </div>
</section>
