<section class="hero-mobile-section relative flex min-h-screen items-center justify-center overflow-hidden px-6 py-20">
  <!-- Background Orbs -->
  <div class="pointer-events-none absolute inset-0 overflow-hidden">
    <div
      class="neon-orb orb-purple animate-float-slow"
      style="top: -80px; left: -80px; width: 350px; height: 350px; opacity: 0.7; filter: blur(50px)"
    ></div>
    <div
      class="neon-orb orb-cyan animate-float-slower"
      style="right: -50px; bottom: -50px; width: 300px; height: 300px; opacity: 0.7; filter: blur(50px)"
    ></div>
    <div
      class="neon-orb orb-magenta animate-float-slow"
      style="top: 30%; right: 10%; width: 250px; height: 250px; opacity: 0.8; filter: blur(50px)"
    ></div>
    <div
      class="warm-orb orb-orange animate-float-slower"
      style="top: 60%; left: -60px; width: 280px; height: 280px; opacity: 0.7; filter: blur(50px)"
    ></div>
    <div
      class="warm-orb orb-red animate-float-slow"
      style="right: 10%; bottom: 20%; width: 220px; height: 220px; opacity: 0.7; filter: blur(50px)"
    ></div>
    <div
      class="warm-orb orb-yellow animate-float-slower"
      style="top: 10%; right: -50px; width: 200px; height: 200px; opacity: 0.7; filter: blur(50px)"
    ></div>
  </div>

  <!-- Main Content -->
  <div class="relative z-10 w-full text-center" data-aos="fade-in" data-aos-duration="1500">
    <!-- Badge -->
    <span class="hero-mobile-badge">Digital Future</span>

    <!-- Brand SVG -->
    <img
      src="images/zemios_title_simple.svg"
      alt="ZEMIOS"
      class="hero-logo mx-auto mb-8 h-auto"
      style="width: 55vw"
    />

    <!-- Headline -->
    <h1 class="hero-mobile-headline" data-aos="fade-up" data-aos-delay="300">
      {{ 'hero.headline' | translate }}
      <span class="z-text-brand-gradient">{{ 'hero.headlineAccent' | translate }}</span>
    </h1>

    <!-- Subtitle -->
    <p class="hero-mobile-subtitle" data-aos="fade-up" data-aos-delay="500">
      {{ 'hero.subtitle' | translate }}
    </p>
  </div>

  <!-- Scroll Indicator -->
  <div
    class="hero-mobile-scroll"
    data-aos="fade-up"
    data-aos-delay="1000"
    data-aos-offset="-200"
  >
    <span class="hero-mobile-scroll__label">{{ 'hero.scrollMobile' | translate }}</span>
    <i class="bi bi-hand-index animate-bounce text-2xl text-slate-400"></i>
  </div>
</section>
